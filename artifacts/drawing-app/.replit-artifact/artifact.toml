kind = "web"
  previewPath = "/"
  title = "Nire Koloreak"
  version = "1.0.0"
  id = "artifacts/drawing-app"
  router = "path"

  [[integratedSkills]]
  name = "react-vite"
  version = "1.0.0"

  [[services]]
  name = "web"
  paths = [ "/" ]
  localPort = 20893

  [services.development]
  run = "pnpm --filter @workspace/drawing-app run dev"

  [services.production]
  build = [ "pnpm", "--filter", "@workspace/drawing-app", "run", "build" ]
  publicDir = "artifacts/drawing-app/dist/public"
  serve = "static"

  [[services.production.rewrites]]
  from = "/*"
  to = "/index.html"

  [services.env]
  PORT = "20893"
  BASE_PATH = "/"
  